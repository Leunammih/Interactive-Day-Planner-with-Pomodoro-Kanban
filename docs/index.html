<title>Day Structure Planner</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky day bar + tabs, then a vertical timeline (time rail | block card that expands into its editor). */
:root{
  --bg:#f1f4f4; --surface:#ffffff; --sunk:#e7eded; --ink:#13252a; --muted:#5a6d72; --line:#d6dfe0;
  --accent:#0d7377; --accent-ink:#ffffff; --accent-soft:#d6eeee;
  --came:#a85f00; --came-soft:#fbead0; --skip:#8b9497; --good:#2f7d4f; --bad:#b23b3b;
  --chip-l:90%; --chip-fg-l:26%;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1517; --surface:#152124; --sunk:#1b2a2e; --ink:#e3ecee; --muted:#93a7ac; --line:#25373b;
  --accent:#4fc2c0; --accent-ink:#06282a; --accent-soft:#133a3b;
  --came:#f0a948; --came-soft:#3a2a12; --skip:#6f7c80; --good:#6cc490; --bad:#ef7b7b;
  --chip-l:24%; --chip-fg-l:84%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1517; --surface:#152124; --sunk:#1b2a2e; --ink:#e3ecee; --muted:#93a7ac; --line:#25373b;
  --accent:#4fc2c0; --accent-ink:#06282a; --accent-soft:#133a3b;
  --came:#f0a948; --came-soft:#3a2a12; --skip:#6f7c80; --good:#6cc490; --bad:#ef7b7b;
  --chip-l:24%; --chip-fg-l:84%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.pill{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--skip);display:inline-block}
.pill[data-s="cloud"] i{background:var(--good)} .pill[data-s="saving"] i{background:var(--came)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav .iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.daynav label{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.daynav input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.today{font-size:13px;padding:0 10px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:11px;padding:3px;gap:3px}
.tabs a{text-align:center;padding:7px 4px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* banners */
.note{margin-top:14px;padding:11px 13px;border-radius:var(--r);background:var(--sunk);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note p{margin:0;flex:1 1 220px;min-width:0;color:var(--muted)}
.note.example{background:var(--came-soft)} .note.example p{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;min-height:38px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.came{border-color:var(--came);color:var(--came);background:transparent}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* timeline */
ol.tl{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start}
.time{padding-top:12px;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.3}
.time b{display:block;font-weight:600;font-size:14px}
.time small{color:var(--muted);font-size:11.5px}
.drift{display:inline-block;margin-top:4px;font-size:11px;padding:1px 5px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.drift.late{background:var(--came-soft);color:var(--came)} .drift.early{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.item.inserted .card{border-color:var(--came);border-style:dashed}
.item.skipped .head .content{text-decoration:line-through;color:var(--muted)}
.item.open .card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.head{display:grid;gap:5px;width:100%;text-align:left;background:none;border:0;padding:11px 13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{--h:180;display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:hsl(var(--h) 40% var(--chip-l));color:hsl(var(--h) 55% var(--chip-fg-l));max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px}
.tag.came{background:var(--came-soft);color:var(--came)} .tag.done{background:var(--accent-soft);color:var(--accent)} .tag.skip{background:var(--sunk);color:var(--muted)}
.content{font-size:15px;overflow-wrap:anywhere}
.was{font-size:13px;color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}
.cmt{font-size:13.5px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.rates{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.minidots{letter-spacing:1px;color:var(--accent)} .minidots .off{color:var(--line)}

/* editor */
.editor{border-top:1px solid var(--line);padding:12px 13px 14px;display:grid;gap:12px;background:var(--surface)}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
input[type=text],input[type=time],input[type=number],textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:16px}
textarea{resize:vertical;min-height:44px;line-height:1.4}
input[type=time],input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.durrow{display:flex;gap:6px;align-items:center}
.durrow input{flex:1}
.durrow button{width:42px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);font-family:var(--f-mono);font-size:13px;flex:none}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12.5px;font-family:var(--f-mono)}
.quick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--sunk);padding:3px;border-radius:10px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.dots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dots .lbl{font-size:12px;color:var(--muted);margin-left:4px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.addbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.foot b{color:var(--ink);font-family:var(--f-mono);font-weight:600}

/* empty */
.empty{margin-top:24px;padding:22px 18px;border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:12px;text-align:left}
.empty h2{font-family:var(--f-display);font-size:19px;margin:0}

/* review */
h2.sec{font-family:var(--f-display);font-size:18px;margin:26px 0 10px;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.stat span{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;display:block}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:4px 4px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.cmp{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.cmp li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.cmp li.came{border-style:dashed;border-color:var(--came)}
.cmp .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;display:block}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.lists ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.lists .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.lists h3{margin:0 0 6px;font-size:14px}
.lists .w h3{color:var(--good)} .lists .d h3{color:var(--bad)}

/* table */
.tablewrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;min-width:980px;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.num{white-space:nowrap}
tr.came td{background:var(--came-soft)}
tr.skip td{color:var(--muted)}
tr[data-id]{cursor:pointer}

/* export */
.panel{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:10px}
.panel h2{margin:0;font-family:var(--f-display);font-size:17px}
.panel textarea{font-family:var(--f-mono);font-size:12.5px;min-height:160px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:420px){.item{grid-template-columns:52px minmax(0,1fr);gap:8px}.time{font-size:12px}.time b{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
/* v2: 5-minute selects, pomodoro tasks, break ideas */
.pill{min-width:0;overflow:hidden}#pilltxt{overflow:hidden;text-overflow:ellipsis}h1{flex:none}
.tsel{display:flex;align-items:center;gap:4px}
.tsel span{color:var(--muted)}
select{min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 8px;font-size:16px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tsel select{flex:1}
.durrow select{flex:1}
select.wide{width:100%;font-family:var(--f-body)}
#undoBtn:disabled{opacity:.35}
@keyframes nowflash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.item.nowflash .card{animation:nowflash 1.6s ease-out}
.toprow>span{flex:1 1 0;justify-content:flex-end}.toprow .pill{flex:0 1 auto}#pilltxt{min-width:0}#pill:has(~#syncBtn:not([hidden])) #pilltxt{display:none}.toprow>span{gap:6px!important}
.kindrow{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--sunk);padding:3px;border-radius:10px}
.kindrow button{border:0;background:transparent;border-radius:8px;padding:7px 2px;font-size:13px;font-weight:600;color:var(--muted)}
.kindrow button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip.pomo{background:var(--accent);color:var(--accent-ink)}
.chip.brk{background:var(--accent-soft);color:var(--accent)}
.chip.rst{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.chip.intr{background:var(--came-soft);color:var(--came)}
.item.k-restore .card{background:color-mix(in srgb,var(--good) 6%,var(--surface))}
.item.k-interrupted .card{border-style:dashed}
.item.k-break .card{background:var(--bg)}
.tag.was{background:var(--sunk);color:var(--muted)}
.item.k-break .head{padding-block:8px}
ol.tasks{margin:0;padding-left:20px;display:grid;gap:2px;font-size:14.5px}
ol.tasks li{overflow-wrap:anywhere}
ol.tasks .est{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.oc{font-weight:700;margin-right:3px}
.oc.done{color:var(--good)} .oc.partial{color:var(--came)} .oc.none{color:var(--bad)}
.extra{font-size:13.5px;color:var(--came)}
.taskbox{display:grid;gap:10px}
.task .mv{border:0;background:transparent;color:var(--muted);width:28px;height:34px;flex:none;padding:0;font-size:16px}
.task .mv:disabled{opacity:.25}
.tstate .tmv{margin-left:auto;display:flex;align-items:center}
.tstate .tmv button{border:0;background:transparent;border-radius:8px;min-height:34px;padding:0;width:32px}
ol.tl{overflow-anchor:none}
.cbox{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--surface);font-weight:800;font-size:17px;display:grid;place-items:center;padding:0}
.cbox[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.task.is-done .row input[type=text]{text-decoration:line-through;color:var(--muted)}
.task.is-carried{opacity:.7}
.tstate{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tstate button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px;color:var(--muted);min-height:32px}
.tstate button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.taskbox{grid-template-columns:minmax(0,1fr)}.task{min-width:0;grid-template-columns:minmax(0,1fr)}.task .row input[type=text]{min-width:0}
.tdur{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.tdur>div{display:grid;gap:3px;line-height:1.2;align-content:start;font-size:13px;color:var(--muted)}
.tdur .wbtn.sm{width:100%;min-height:40px;padding-block:6px}
.task input.tnote{font-size:14px;padding:7px 10px}
.task .from{font-size:12px;color:var(--came)}
.psum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);padding:2px 2px 0}
.psum b{color:var(--ink);font-weight:650}
.tally{display:flex;align-items:center;gap:8px}
.tally button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);font-size:18px}
.tally b{min-width:22px;text-align:center;font-family:var(--f-mono)}
details.cmtbox>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 0}
details.cmtbox>summary::-webkit-details-marker{display:none}
details.cmtbox>summary::before{content:"▸";font-size:11px}
details.cmtbox[open]>summary::before{content:"▾"}
details.cmtbox>summary .pv{text-transform:none;letter-spacing:0;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
details.cmtbox textarea{width:100%;margin-top:4px}
.task{display:grid;gap:7px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.task .row{display:flex;gap:6px;align-items:center}
.task .row input[type=text]{flex:1}
.task .row select{flex:none;width:96px}
.task .x{border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:38px;flex:none}
.task .tname{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.task .seg{grid-template-columns:repeat(3,1fr)}
.task .seg button{font-size:12.5px}
.task.extra-t{border-style:dashed;border-color:var(--came)}
.task.extra-t .row{flex-wrap:wrap}.task.extra-t .row input[type=text]{flex:1 1 100%}
.tag.warn{background:var(--came-soft);color:var(--bad)}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13.5px;text-align:left}
.ideas button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prios{margin-top:14px;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:8px}
.prios h2{margin:0;font-family:var(--f-display);font-size:16px}
details.prios{display:block}
.pbody{display:grid;gap:8px;margin-top:8px}
details.prios>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;min-width:0}
details.prios>summary::-webkit-details-marker{display:none}
details.prios>summary::before{content:"▸";color:var(--muted);font-size:12px}

const LIST_NAMES = {five:"5-minute breaks", ten:"10-minute breaks", fifteen:"15-minute breaks", long:"Long breaks (45 min to 1 h)", routine:"Morning routine", small:"Smaller optional tasks", restore:"Restore / off", interrupt:"Interruptions", topics:"Pomodoro topics"};

const ALL_DURS = [5,10,15,20,30,45,60,90];
function mkTask(name, est){ return {id:uid(), name:name||"", est:est ?? null, actual:null, outcome:""}; }

const MEAL = (name, dur, choices, content) => mkRow({kind:"meal", type:name, planDur:dur, choices, content:content||""});
const choicesFor = dur => dur <= 5 ? [5,10] : dur <= 10 ? [10,15] : dur <= 30 ? [15,20,30] : [45,60,90];
const ideaList = dur => dur <= 5 ? "five" : dur <= 10 ? "ten" : dur < 45 ? "fifteen" : "long";
const usualSequence = () => [POMO("Priority tasks"), BRK(5,[5,10]), POMO("Priority tasks"), BRK(10,[10,15]), POMO("Priority tasks"), BRK(15,[15,20,30]), POMO("Priority tasks"), BRK(60,[45,60,90])];

/* ---------- state ---------- */
const S = { days:{}, template:null, settings:null, date:todayISO(), view:"plan", open:null, confirmDel:null, mode:"local", uid:null, exportText:null, settled:false, ideasOpen:false, seqDur:5 };
const LS_KEY = "dayStructure.v1";
const SET = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
const mins = t => { const m = /(\d+)\s*(?:min|m)\b/i.exec(t || ""); return m ? Number(m[1]) : 0; };
function loadLocal(){ try { const j = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (j && j.days) { S.days = j.days; S.template = j.template || null; S.settings = j.settings || null; S.backlog = j.backlog || null; } } catch(e){} normAll(); if (!S.backlog || !Array.isArray(S.backlog.items)) S.backlog = blSeed(); blMigrate(); }

/* ---------- safety copies ---------- */
const BAK_KEY = "dayStructure.backups";

  d.rows.forEach(r => { if (r.status && r.status !== "todo") n += 3; if (r.inserted) n += 3; if (r.revised || r.comments || r.worked || r.didnt) n += 3; if (r.energy || r.focus) n += 2; (r.tasks || []).forEach(t => { if (t.name) n += 1; if (t.outcome) n += 2; }); });
  (d.priorities || []).forEach(x => { if (x) n += 2; }); (d.small || []).forEach(() => n += 1); if (d.reflection) n += 3; return n; }
function loadBaks(){ try { return JSON.parse(localStorage.getItem(BAK_KEY) || "[]"); } catch(e){ return []; } }
function pushBackup(day, from){
  if (!day || !day.date || !Array.isArray(day.rows) || !day.rows.length) return;
  const list = loadBaks(), sig = JSON.stringify(day.rows);
  if (list.some(b => b.date === day.date && JSON.stringify(b.day.rows) === sig)) return;
  list.push({date: day.date, at: Date.now(), from, score: dayScore(day), day: JSON.parse(JSON.stringify(day))});
  while (list.length > 40) list.shift();
  try { localStorage.setItem(BAK_KEY, JSON.stringify(list)); } catch(e){ try { localStorage.setItem(BAK_KEY, JSON.stringify(list.slice(-10))); } catch(e2){} }
}
S.cloudBaks = {}; S.remoteSeen = {};
function bestBackup(date){
  const cur = dayScore(S.days[date]); const all = [...loadBaks().filter(b => b.date === date), ...Object.values(S.cloudBaks).filter(b => b.date === date)];
  return all.filter(b => (b.score ?? dayScore(b.day)) > cur + 3).sort((a, b) => (b.score ?? dayScore(b.day)) - (a.score ?? dayScore(a.day)) || b.at - a.at)[0] || null;
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({days:S.days, template:S.template, settings:S.settings, backlog:S.backlog})); } catch(e){} }
function getDay(date, create){
  let d = S.days[date];
  if (!d && create) { d = S.days[date] = {date, rows:[], planLocked:false, reflection:"", priorities:["","",""], updatedAt:0}; }
  return d;
}
const curDay = () => S.days[S.date] || null;

/* ---------- cloud (db capability, private per person) ---------- */
let coll = null;
const pending = {}; const writing = {};
function setPill(s, txt){ const p = $("#pill"); p.dataset.s = s; $("#pilltxt").textContent = txt; }
const DIRTY_KEY = "dayStructure.dirty";
let dirty = new Set(); try { dirty = new Set(JSON.parse(localStorage.getItem(DIRTY_KEY) || "[]")); } catch(e){}
function saveDirty(){ try { localStorage.setItem(DIRTY_KEY, JSON.stringify([...dirty])); } catch(e){} updateSyncBtn(); }
function updateSyncBtn(){ const b = $("#syncBtn"); if (!b) return; const n = dirty.size; b.hidden = n === 0; b.textContent = n ? `Sync ${n}` : "Sync"; b.setAttribute("aria-label", `Sync ${n} unsaved change${n === 1 ? "" : "s"} to your account`); }
const getterFor = id => () => id === "template" ? S.template : id === "settings" ? S.settings : id === "backlog" ? S.backlog : S.days[id.slice(4)];
function pillIdle(){
  if (!navigator.onLine) setPill("local", "Offline · saved on this device");
  else if (S.mode === "cloud" && dirty.size) setPill("saving", `${dirty.size} change${dirty.size === 1 ? "" : "s"} not synced yet`);
  else if (S.mode === "cloud") setPill("cloud", "Synced");
  else setPill("local", "Saved on this device");
  updateSyncBtn();
}
function syncNow(manual){
  if (!navigator.onLine) { if (manual) toast("You're offline. Your changes are safe on this device."); pillIdle(); return; }
  if (!coll) { if (manual) toast("Connecting to your account…"); initCloud(); return; }
  [...dirty].forEach(id => { if (!writing[id]) flush(id, getterFor(id)); });
  if (manual && !dirty.size) toast("Everything is synced");
}
const docIdFor = date => "day-" + date;
/* ---------- undo ---------- */
const UNDO = []; let UBB = null, UB = {}, UBS = null, USRC = null, ULAST = {t:0, src:null}, UBUSY = false;
const usnap = o => JSON.stringify(o == null ? null : o, (k, v) => k === "updatedAt" ? undefined : v);
function ubaseline(){ const d = S.days[S.date]; if (d && UB[S.date] === undefined) UB[S.date] = usnap(d); if (UBS === null) UBS = usnap(S.settings); if (UBB === null) UBB = usnap(S.backlog); }
function ubaseReset(){ UB = {}; UBS = null; UBB = null; ubaseline(); }
function upush(date, kind, prev){
  if (UBUSY) return;
  const now = Date.now(), top = UNDO[UNDO.length - 1];
  const merge = top && (now - ULAST.t < 80 || (USRC && USRC === ULAST.src && now - ULAST.t < 2500));
  ULAST = {t: now, src: USRC};
  if (merge) { if (kind === "d") { top.days = top.days || {}; if (top.days[date] === undefined) top.days[date] = prev; } else if (kind === "b") { if (top.bl === undefined) top.bl = prev; } else if (top.set === undefined) top.set = prev; return; }
  UNDO.push(kind === "d" ? {date, days: {[date]: prev}} : kind === "b" ? {date: S.date, bl: prev} : {date: S.date, set: prev});

}
function updateUndoBtn(){ const b = $("#undoBtn"); if (b) { b.disabled = !UNDO.length; b.title = UNDO.length ? `Undo (${UNDO.length})` : "Nothing to undo"; } }
function undo(){

    if (e.days) Object.entries(e.days).forEach(([date, js]) => { const v = JSON.parse(js) || {date, rows:[], reflection:"", priorities:["","",""]}; S.days[date] = v; v.rows = (v.rows || []).map(normRow); touch(date); });

    if (e.bl !== undefined) { S.backlog = JSON.parse(e.bl) || blSeed(); touchBacklog(); UBB = usnap(S.backlog); if (!$("#sheet").hidden && $("#sheet").dataset.bl) { if (blGet($("#sheet").dataset.bl)) blSheet($("#sheet").dataset.bl); else blClose(); } }
  } finally { UBUSY = false; }
  if (e.date) S.date = e.date; S.confirmDel = null; render(); updateUndoBtn();
  toast(UNDO.length ? `Undone · ${UNDO.length} more step${UNDO.length === 1 ? "" : "s"} back` : "Undone");
}
function touch(date){ const d = S.days[date]; if (!d) return; normalizePlan(d); delete d.example;
  const cur = usnap(d), prev = UB[date] !== undefined ? UB[date] : usnap({date, rows:[], reflection:"", priorities:["","",""]});
  if (prev !== cur) upush(date, "d", prev); UB[date] = cur;
  d.updatedAt = Date.now(); saveLocal(); queueCloud(docIdFor(date), () => S.days[date]); }
function touchTemplate(){ S.template.updatedAt = Date.now(); saveLocal(); queueCloud("template", () => S.template); }
function touchSettings(){ const cur = usnap(S.settings); if (UBS !== null && UBS !== cur) upush(S.date, "s", UBS); UBS = cur; S.settings.updatedAt = Date.now(); saveLocal(); queueCloud("settings", () => S.settings); }

function queueCloud(id, getter){ dirty.add(id); saveDirty(); if (!coll || !navigator.onLine) { pillIdle(); return; } setPill("saving", "Saving…"); clearTimeout(pending[id]); pending[id] = setTimeout(() => flush(id, getter), 700); }
async function flush(id, getter){
  if (writing[id]) { pending[id] = setTimeout(() => flush(id, getter), 400); return; }
  writing[id] = true;
  try { const body = JSON.parse(JSON.stringify(getter() || {}));
    const prev = S.remoteSeen[id];
    if (id.startsWith("day-") && prev && Array.isArray(prev.rows) && prev.rows.length && JSON.stringify(prev.rows) !== JSON.stringify(body.rows)) {
      const h = new Date(); const bid = "bak-" + id + "-" + String(h.getHours()).padStart(2, "0");
      if (S.lastBak !== bid + (prev.updatedAt || 0)) { S.lastBak = bid + (prev.updatedAt || 0); coll.doc(bid).set(Object.assign({}, prev, {bakAt: Date.now()})).catch(() => {}); }
    }
    if (id === "backlog" && prev && Array.isArray(prev.items) && JSON.stringify(prev.items) !== JSON.stringify(body.items)) {
      const bid = "bak-backlog-" + String(new Date().getHours()).padStart(2, "0");
      if (S.lastBlBak !== bid + (prev.updatedAt || 0)) { S.lastBlBak = bid + (prev.updatedAt || 0); coll.doc(bid).set(Object.assign({}, prev, {bakAt: Date.now()})).catch(() => {}); }

function settle(){ if (S.settled) return; S.settled = true; safeRender(); }
async function initCloud(){
  try {
    if (!window.claude || !window.claude.use) { settle(); return; }
    const [dbns, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!dbns || !user) { settle(); return; }
    const id = await user.id(); if (!id) { settle(); return; }
    S.uid = id; coll = dbns.collection("data/users/" + id);
    let first = true;
    const timer = setTimeout(() => { if (first) { setPill("local", "Sync not reachable · saved on device"); settle(); } }, 10000);
    coll.onSnapshot(snap => {
      let changed = false;
      snap.docs.forEach(doc => {
        const data = doc.data(); if (!data) return;

        if (doc.id === "backlog") { S.remoteSeen.backlog = JSON.parse(JSON.stringify(data)); if (Array.isArray(data.items) && (!S.backlog || (data.updatedAt||0) > (S.backlog.updatedAt||0))) { if (S.backlog && Array.isArray(S.backlog.items) && S.backlog.items.length > data.items.length && !S.backlog.seeded) blLocalBak(S.backlog); S.backlog = JSON.parse(JSON.stringify(data)); blMigrate(); changed = true; } return; }

function chartSVG(d, ctx){

  if (pts.length < 2) return `<p class="hint" style="padding:6px">Rate energy and concentration on at least two blocks to see the curve of your day.</p>`;
  const W = 640, H = 200, L = 34, R = 14, T = 12, B = 28;
  const t0 = Math.min(...d.rows.map(r => ctx[r.id].start)), t1 = Math.max(...d.rows.map(r => ctx[r.id].end));

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Energy and concentration across the day">${g}${line("e","var(--accent)")}${line("f","var(--came)")}</svg>

  const g = e.target.closest && e.target.closest("[data-grip]"); if (!g || S.view !== "backlog") return;
  e.preventDefault(); const card = g.closest(".kcard"), r = card.getBoundingClientRect();
  const ghost = card.cloneNode(true); ghost.classList.add("kghost"); ghost.style.width = r.width + "px"; ghost.style.left = r.left + "px"; ghost.style.top = r.top + "px"; document.body.appendChild(ghost);
  card.classList.add("dragging");
  BD = {id: g.dataset.grip, card, ghost, dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, pid: e.pointerId, tg: null};
  try { g.setPointerCapture(e.pointerId); } catch(err){}
  BD.raf = requestAnimationFrame(bdAuto);
});
document.addEventListener("pointermove", e => { if (!BD || e.pointerId !== BD.pid) return; e.preventDefault();
  BD.x = e.clientX; BD.y = e.clientY; BD.ghost.style.left = (e.clientX - BD.dx) + "px"; BD.ghost.style.top = (e.clientY - BD.dy) + "px";
  bdClear(); const tg = BD.tg = bdTarget(e.clientX, e.clientY); if (!tg) return;
  const colEl = document.querySelector(`.kcol[data-col="${tg.col}"]`); if (colEl) colEl.classList.add("over");
  if (tg.el) tg.el.classList.add(tg.mode === "into" ? "drop-into" : tg.mode === "before" ? "drop-before" : "drop-after");
}, {passive: false});
function bdEnd(e, cancel){ if (!BD || (e && e.pointerId !== BD.pid)) return; cancelAnimationFrame(BD.raf); bdClear(); BD.ghost.remove(); BD.card.classList.remove("dragging");
  const tg = cancel ? null : (e ? bdTarget(e.clientX, e.clientY) : BD.tg); let ok = false; if (tg) ok = bdApply(tg); const id = BD.id; BD = null;
  if (ok) { touchBacklog(); render(); const it = blGet(id); toast(`Moved${it && it.parent ? " · " + blPath(it) : ""} · ${BCOL[it.col].e} ${BCOL[it.col].l}`); setTimeout(() => { const c = document.querySelector(`.kcard[data-bl="${id}"]`); if (c) { c.classList.add("nowflash"); } }, 30); } }
document.addEventListener("pointerup", e => bdEnd(e));
document.addEventListener("pointercancel", e => bdEnd(e, true));
function blDraggable(){}

/* ---------- navigation ---------- */
function setDate(iso){ if (!iso) return; S.date = iso; S.open = null; render(); window.scrollTo(0,0); }
$("#prevDay").onclick = () => setDate(addDays(S.date, -1));
$("#nextDay").onclick = () => setDate(addDays(S.date, 1));
$("#goToday").onclick = () => setDate(todayISO());
function jumpNow(){
  if (S.date !== todayISO()) { S.date = todayISO(); }
  if (S.view !== "plan" && S.view !== "actual") { S.view = "actual"; history.replaceState(null, "", "#actual"); }
  render();
  const d = curDay(); if (!d || !d.rows.length) { window.scrollTo(0, 0); toast("Nothing planned today yet"); return; }
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  let rows, span;
  if (S.view === "plan") { rows = planRows(d); span = r => [r.planStart, planEnd(r)]; }
  else { const ctx = computeActual(d); rows = d.rows.filter(r => r.status !== "skipped"); span = r => [ctx[r.id].start, ctx[r.id].end]; }
  const hit = rows.find(r => { const [a, b] = span(r); return a <= m && m < b; }) || rows.find(r => span(r)[0] > m) || rows[rows.length - 1];
  if (!hit) return;
  if (S.view === "actual") { S.open = hit.id; render(); }
  const li = document.querySelector(`[data-row="${hit.id}"]`); if (!li) return;
  const hb = document.querySelector("header.bar"), top = hb ? hb.getBoundingClientRect().bottom : 0;
  window.scrollBy({top: li.getBoundingClientRect().top - top - 12, behavior: "smooth"});
  li.classList.remove("nowflash"); void li.offsetWidth; li.classList.add("nowflash");
}
$("#nowBtn").onclick = jumpNow;
$("#syncBtn").onclick = () => syncNow(true);
$("#undoBtn").onclick = () => undo();
window.addEventListener("online", () => { pillIdle(); syncNow(false); });
window.addEventListener("offline", pillIdle);
$("#reloadBtn").onclick = () => { try { saveLocal(); } catch(e){} location.reload(); };
$("#datePick").addEventListener("change", e => setDate(e.target.value));
function route(){ const h = location.hash.slice(1); S.view = ["backlog","plan","actual","review","table"].includes(h) ? h : (S.view || "plan"); S.confirmDel = null; render(); }
window.addEventListener("hashchange", route);

/* ---------- boot ---------- */
loadLocal();
if (!Object.keys(S.days).length && todayISO() <= "2026-11-05") { const t = todayISO(); S.days[t] = {date:t, rows:EXAMPLE_ROWS.map(mkRow), planLocked:false, reflection:"", priorities:["","",""], updatedAt:0, example:true}; }
if (!location.hash && curDay() && curDay().example) S.view = "actual";
route();
UNDO.length = 0; ubaseReset(); updateUndoBtn();
if (T) { if (T.running && T.endAt <= Date.now()) { T.running = false; T.done = true; T.left = 0; T.doneAt = T.endAt; saveT(); } runTimer(); }
pillIdle();
initCloud();
})();
